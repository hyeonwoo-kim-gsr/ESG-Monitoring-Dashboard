<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG 모니터링 · GS리테일 ESG파트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-header">
      <p class="sidebar-eyebrow">GS RETAIL</p>
      <h1 class="sidebar-title">ESG 모니터링</h1>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item is-active" data-tab="daily" data-title="일자별 리포트">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        <span>일자별 리포트</span>
      </button>
      <button class="nav-item" data-tab="weekly" data-title="주간 보도 랭킹">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="4" height="10" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="16" y="13" width="4" height="7" rx="1"/></svg>
        <span>주간 보도 랭킹</span>
      </button>
      <button class="nav-item" data-tab="monthly" data-title="기업별 월간 보도 모음">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span>기업별 월별 모음</span>
      </button>
      <button class="nav-item" data-tab="search" data-title="키워드 검색">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>키워드 검색</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <p class="sidebar-meta" id="lastUpdated">데이터를 불러오는 중…</p>
    </div>
  </aside>

  <main class="main">

    <div id="fallbackBanner" class="fallback-banner" hidden>
      지금은 예시 데이터로 화면을 미리 보여주고 있습니다. 실제 수집 데이터(docs/data)가 연결되면 자동으로 전환됩니다.
    </div>

    <header class="main-header">
      <h2 id="panelTitle">일자별 리포트</h2>
    </header>

    <!-- 1. 일자별 리포트 조회 -->
    <section class="panel is-active" id="panel-daily">
      <div class="toolbar-card">
        <label class="field">
          <span>조회 날짜</span>
          <input type="date" id="dailyDate">
        </label>
        <div class="field-buttons">
          <button class="btn-ghost" id="dailyPrev" type="button">‹ 전날</button>
          <button class="btn-ghost" id="dailyNext" type="button">다음날 ›</button>
        </div>
      </div>
      <div id="dailyResult" class="result"></div>
    </section>

    <!-- 2. 주간 보도 랭킹 -->
    <section class="panel" id="panel-weekly">
      <div class="toolbar-card">
        <label class="field">
          <span>월</span>
          <select id="weeklyMonth"></select>
        </label>
        <label class="field">
          <span>주차</span>
          <select id="weeklyWeek"></select>
        </label>
      </div>
      <p class="hint">같은 주제로 여러 매체가 보도한 기사일수록 상위에 표시됩니다. (관련 보도 건수 기준, 월~일 기준 주차)</p>
      <div id="weeklyResult" class="result"></div>
    </section>

    <!-- 3. 기업별 월간 보도 모음 -->
    <section class="panel" id="panel-monthly">
      <div class="toolbar-card">
        <label class="field">
          <span>기업</span>
          <select id="monthlyCompany"></select>
        </label>
        <label class="field">
          <span>월</span>
          <select id="monthlyMonth"></select>
        </label>
        <button class="btn-excel" id="monthlyExport" type="button">엑셀로 추출하기</button>
      </div>
      <div id="monthlyResult" class="result"></div>
    </section>

    <!-- 4. 키워드 검색 -->
    <section class="panel" id="panel-search">

      <div class="mode-tabs" role="tablist">
        <button class="mode-tab is-active" id="modeBasic" type="button">기본 검색</button>
        <button class="mode-tab" id="modeDetail" type="button">상세 검색</button>
      </div>

      <!-- 기본 검색 -->
      <div class="toolbar-card" id="searchBasicBox">
        <label class="field field-grow">
          <span>검색어</span>
          <input type="text" id="searchInput" placeholder="예: 탄소중립, 협력사, 지속가능경영보고서…">
        </label>
        <button class="btn-primary" id="searchRun" type="button">검색</button>
      </div>

      <!-- 상세 검색 -->
      <div class="toolbar-card detail-grid" id="searchDetailBox" hidden>
        <label class="field">
          <span>조건1 · 기업명</span>
          <select id="detailCompany"></select>
        </label>
        <label class="field field-grow">
          <span>조건2 · 첫번째 키워드</span>
          <input type="text" id="detailKw1" placeholder="예: 탄소중립">
        </label>
        <label class="field">
          <span>키워드 결합</span>
          <select id="detailOp">
            <option value="AND">AND (모두 포함)</option>
            <option value="OR">OR (하나라도 포함)</option>
            <option value="NOT">NOT (두번째는 제외)</option>
          </select>
        </label>
        <label class="field field-grow">
          <span>조건3 · 두번째 키워드</span>
          <input type="text" id="detailKw2" placeholder="예: 협력사">
        </label>
        <label class="field">
          <span>긍정/부정</span>
          <select id="detailSentiment">
            <option value="">전체</option>
            <option value="POSITIVE">긍정</option>
            <option value="NEGATIVE">부정</option>
          </select>
        </label>
        <label class="field">
          <span>조건4 · 기간 시작</span>
          <input type="date" id="detailStart">
        </label>
        <label class="field">
          <span>기간 종료</span>
          <input type="date" id="detailEnd">
        </label>
        <div class="field-buttons">
          <button class="btn-primary" id="detailRun" type="button">상세 검색</button>
          <button class="btn-ghost" id="detailReset" type="button">초기화</button>
        </div>
      </div>

      <div class="search-actions">
        <p class="hint" style="margin:0;">제목과 본문 요약 안에서 검색어를 찾습니다. 누적된 전체 자료를 대상으로 하며 결과 개수 제한은 없습니다.</p>
        <button class="btn-excel" id="searchExport" type="button">엑셀로 추출하기</button>
      </div>
      <div id="searchResult" class="result"></div>
    </section>

    <footer class="footer">
      <p>본 자료는 네이버 뉴스 검색 결과를 자동 수집·분류한 것으로, 보도의 정확성에 대해 보증하지 않습니다.</p>
    </footer>

  </main>
</div>

<!-- 엑셀 추출용 라이브러리(SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="sample-data.js"></script>
<script src="app.js"></script>
</body>
</html>
